[project]
name = "acopula"
version = "0.1.0"
description = "Archimedean copula inference via Taylor-mode automatic differentiation in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Cambridge Yang", email = "camyang@csail.mit.edu" },
    { name = "Dongdong Li", email = "dli.stats@gmail.com" },
]
keywords = [
    "copula",
    "archimedean-copula",
    "nested-copula",
    "automatic-differentiation",
    "taylor-mode",
    "jax",
    "survival-analysis",
    "censored-likelihood",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.8,<0.9",
    "jet-array==0.1.0a2",
    "jaxopt>=0.8",
    "optimistix>=0.0.6",
    "quadax>=0.2.9",
    "equinox>=0.13",
    # Direct ref to the patched fork (jax-0.8 import fixes + copy_p ILDJ +
    # tfp-nightly dep).  pip and uv both honor this, so `pip install
    # git+<acopula>` works.  NOTE: a git URL here makes the package
    # un-uploadable to PyPI; swap back to `oryx>=<ver>` once a jax-0.8
    # compatible oryx is published.
    "oryx @ git+https://github.com/thisiscam/oryx.git@copulaad_support",
    "tfp-nightly==0.26.0.dev20251116",
    "scipy>=1.11",
    "sympy>=1.12",
    "optax>=0.2",
]

[project.urls]
Homepage = "https://github.com/thisiscam/acopula"
Repository = "https://github.com/thisiscam/acopula"
Issues = "https://github.com/thisiscam/acopula/issues"

[project.optional-dependencies]
examples = [
    "matplotlib>=3.7",
    "networkx>=3",
    "pydot>=2",
]
gpu = [
    "jax[cuda12]>=0.8,<0.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
test = ["pytest>=7", "mpmath>=1.3", "pytest-xdist>=3"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-llmstxt>=0.1",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.hatch.metadata]
# acopula depends on the oryx fork via a git direct reference (see
# [project.dependencies]); hatchling requires opting in to build it.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["acopula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy test (deep nesting / e2e sampling / high-d). Deselected in the PR gate via -m 'not slow'; run in the nightly full-suite job.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
