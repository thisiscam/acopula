[project]
name = "acopula"
version = "0.1.0"
description = "Archimedean copula inference via Taylor-mode automatic differentiation in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Cambridge Yang", email = "camyang@csail.mit.edu" },
    { name = "Dongdong Li", email = "dli.stats@gmail.com" },
]
keywords = [
    "copula",
    "archimedean-copula",
    "nested-copula",
    "automatic-differentiation",
    "taylor-mode",
    "jax",
    "survival-analysis",
    "censored-likelihood",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.8,<0.9",
    "jet-array==0.1.0a2",
    "jaxopt>=0.8",
    "optimistix>=0.0.6",
    "quadax>=0.2.9",
    "equinox>=0.13",
    "oryx>=0.2.9",
    "tfp-nightly==0.26.0.dev20251116",
    "scipy>=1.11",
    "sympy>=1.12",
    "optax>=0.2",
]

[project.urls]
Homepage = "https://github.com/thisiscam/acopula"
Repository = "https://github.com/thisiscam/acopula"
Issues = "https://github.com/thisiscam/acopula/issues"

[project.optional-dependencies]
examples = [
    "matplotlib>=3.7",
    "networkx>=3",
    "pydot>=2",
]
gpu = [
    "jax[cuda12]>=0.8,<0.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
test = ["pytest>=7", "mpmath>=1.3"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# oryx pulls in stable `tensorflow-probability`, which collides on disk with
# `tfp-nightly` (both write into the `tensorflow_probability/` namespace).
# Depending on uv's install order, stable's broken `ops.py` (referencing the
# removed `jax.interpreters.xla.pytype_aval_mappings`) wins and crashes at
# import.  Drop stable tfp from resolution; tfp-nightly satisfies every oryx
# import path.
override-dependencies = [
    "tensorflow-probability ; sys_platform == 'never'",
]
# Pin tfp-nightly to the version that works with jax 0.8.x.  Newer nightlies
# remove `jax.interpreters.xla.pytype_aval_mappings` and crash at import.
constraint-dependencies = [
    "tfp-nightly==0.26.0.dev20251116",
]

# PyPI's oryx 0.2.9 imports `from jax import util`, which jax 0.8.x removed.
# The `copulaad_support` branch of the patched fork uses `from jax._src import
# util` and ships the lax.copy_p ILDJ shim acopula expects.  This source
# override applies only under uv; the published `oryx>=0.2.9` PyPI dep stays
# in `dependencies` so a future plain `pip install acopula` works once the
# upstream fix lands.
[tool.uv.sources]
oryx = { git = "https://github.com/thisiscam/oryx.git", branch = "copulaad_support" }
# jet-array 0.1.0a2 (PyPI) ships the log-space Taylor expansion (sign, log|c|)
# that bell.py's log_jet=True path uses, plus the pow_p/scan_p jet rules and the
# log_add structural-zero NaN-gradient guard — so the published wheel now
# suffices and no git source is needed.

[tool.hatch.build.targets.wheel]
packages = ["acopula"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
