[project]
name = "acopula"
version = "0.1.0"
description = "Archimedean copula inference via Taylor-mode automatic differentiation in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Cambridge Yang", email = "camyang@csail.mit.edu" },
    { name = "Dongdong Li", email = "dli.stats@gmail.com" },
]
keywords = [
    "copula",
    "archimedean-copula",
    "nested-copula",
    "automatic-differentiation",
    "taylor-mode",
    "jax",
    "survival-analysis",
    "censored-likelihood",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.8,<0.9",
    "jet-array>=0.1.0",
    "jaxopt>=0.8",
    "optimistix>=0.0.6",
    "quadax>=0.2.9",
    "equinox>=0.13",
    "oryx>=0.2.9",
    "tfp-nightly==0.26.0.dev20251116",
    "scipy>=1.11",
    "sympy>=1.12",
    "optax>=0.2",
]

[project.urls]
Homepage = "https://github.com/thisiscam/acopula"
Repository = "https://github.com/thisiscam/acopula"
Issues = "https://github.com/thisiscam/acopula/issues"

[project.optional-dependencies]
examples = [
    "matplotlib>=3.7",
    "networkx>=3",
    "pydot>=2",
]
gpu = [
    "jax[cuda12]>=0.8,<0.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
test = ["pytest>=7", "mpmath>=1.3"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["acopula"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
