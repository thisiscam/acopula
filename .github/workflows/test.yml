# Installs with uv so the [tool.uv] overrides apply: the oryx/jet-array git
# sources, the dropped stable tensorflow-probability, and the tfp-nightly pin
# that keeps `jax.interpreters.xla.pytype_aval_mappings` available. Plain pip
# ignores those blocks and the import crashes, so do NOT switch back to pip.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # pyproject requires-python = ">=3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --extra test --locked
      - name: Run tests
        run: uv run --extra test python -m pytest -v
